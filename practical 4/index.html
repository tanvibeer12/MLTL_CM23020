<!DOCTYPE html>
<html>
<head>
<title>Image Classification with Pre-trained Model</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.0"></script>

<style>

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#0f172a;
font-family:Segoe UI;
color:white;
}

.panel{
width:520px;
background:#1e293b;
border-radius:20px;
padding:30px;
box-shadow:0 20px 40px rgba(0,0,0,0.6);
}

.header{
text-align:center;
margin-bottom:20px;
}

.header h1{
font-size:22px;
color:#38bdf8;
margin:0;
}

.header span{
font-size:14px;
color:#94a3b8;
}

/* BIG UPLOAD AREA */

.uploadBox{
border:3px dashed #38bdf8;
height:260px;
border-radius:15px;
display:flex;
justify-content:center;
align-items:center;
cursor:pointer;
position:relative;
overflow:hidden;
}

.uploadText{
color:#94a3b8;
font-size:16px;
text-align:center;
}

.uploadBox input{
display:none;
}

/* IMAGE PREVIEW */

.previewImage{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
display:none;
}

/* STATUS */

.status{
margin-top:15px;
font-size:14px;
color:#cbd5f5;
text-align:center;
}

/* RESULT */

.resultCard{
margin-top:15px;
padding:15px;
background:#0f172a;
border-radius:12px;
text-align:center;
font-size:16px;
}

</style>
</head>

<body>

<div class="panel">

<div class="header">
<h1>Image Classification with Pre-trained Model (MobileNet)</h1>
<span>Created by Tanvi</span>
</div>

<label class="uploadBox">

<div class="uploadText" id="uploadText">
Click here to upload image
</div>

<img id="previewImage" class="previewImage">

<input type="file" id="imageInput" accept="image/*">

</label>

<div class="status" id="statusText">
AI model is loading...
</div>

<div class="resultCard" id="predictionBox">
Prediction result will appear here
</div>

</div>

<script src="script.js"></script>

</body>
</html>
