<!DOCTYPE html>
<html>
<head>
<title>Assignment 1 - Image Classification</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>

<style>

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:Arial;
background:linear-gradient(120deg,#4facfe,#00f2fe);
}

.container{
background:white;
width:450px;
padding:30px;
border-radius:18px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
text-align:center;
}

h2{
margin-bottom:5px;
}

p{
color:#555;
margin-bottom:20px;
}

.upload-box{
border:2px dashed #aaa;
height:260px;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
border-radius:12px;
cursor:pointer;
background:#fafafa;
}

.upload-box:hover{
border-color:#4facfe;
}

.upload-box img{
max-width:100%;
max-height:100%;
border-radius:10px;
}

input{
display:none;
}

button{
margin-top:15px;
padding:10px 18px;
border:none;
background:#4facfe;
color:white;
border-radius:8px;
cursor:pointer;
}

.result{
margin-top:20px;
text-align:left;
}

.prediction{
background:#f3f6ff;
padding:10px;
border-radius:8px;
margin-top:8px;
}

</style>
</head>

<body>

<div class="container">

<h2>Image Classification</h2>
<p>Upload an image to see Top-3 predictions</p>

<label class="upload-box">
<input type="file" id="upload" accept="image/*">
<img id="img">
<span id="text">Click to Upload Image</span>
</label>

<div id="output" class="result"></div>

</div>

<script src="script.js"></script>

</body>
</html>
