
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Music Genre Analyzer • Music Intelligence</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter;
}

body{

background:radial-gradient(circle at top,#1c214f,#040613);

color:white;

min-height:100vh;

display:flex;
flex-direction:column;
align-items:center;

padding:40px;

}

/* HEADER */

header{
text-align:center;
margin-bottom:40px;
}

header h1{
font-family:Orbitron;
font-size:38px;
letter-spacing:2px;
}

header p{
opacity:.7;
margin-top:5px;
}

/* MAIN PANEL */

.panel{

width:950px;

background:rgba(255, 255, 255, 0.04);

border-radius:20px;

padding:40px;

backdrop-filter:blur(20px);

box-shadow:0 30px 70px rgba(0,0,0,.6);

text-align:center;

}

/* CIRCLE UPLOAD */

.circle-upload{

width:200px;
height:200px;

border-radius:50%;

margin:auto;

display:flex;
align-items:center;
justify-content:center;

background:linear-gradient(145deg,#6f7cff,#b07cff);

cursor:pointer;

position:relative;

box-shadow:0 0 40px rgba(15, 159, 132, 0.7);

transition:.3s;

}

.circle-upload:hover{
transform:scale(1.05);
}

.circle-upload span{
font-weight:600;
}

input{
display:none;
}

/* VISUALIZER */

.visualizer{

margin-top:25px;

height:80px;

display:flex;
align-items:flex-end;
justify-content:center;

gap:4px;

}

.bar{

width:5px;

background:linear-gradient(#7afcff,#7c7cff);

height:20px;

border-radius:3px;

animation:move 1s infinite ease-in-out;

}

@keyframes move{

0%{height:10px}
50%{height:70px}
100%{height:10px}

}

/* AUDIO */

audio{

width:100%;
margin-top:20px;

}

/* SPECTROGRAM */

canvas{

margin-top:30px;

width:100%;

border-radius:12px;

background:#020414;

}

/* GENRE GRID */

.genre-grid{

display:grid;

grid-template-columns:repeat(4,1fr);

gap:12px;

margin-top:30px;

}

.genre{

background:#10163a;

padding:15px;

border-radius:10px;

transition:.3s;

}

.genre.active{

background:linear-gradient(45deg,#6ff1ff,#b07cff);

}

.score{

margin-top:5px;

font-size:18px;

}

/* BUTTON */

button{

margin-top:20px;

padding:10px 22px;

border:none;

border-radius:10px;

background:linear-gradient(45deg,#6f7cff,#b07cff);

color:white;

cursor:pointer;

}

</style>

</head>

<body>

<header>

<h1>Music Genre Analyzer  -Created by Tanvi</h1>

<p>Intelligent Music Genre Recognition</p>

</header>

<div class="panel">

<label class="circle-upload">

<span>Upload Audio</span>

<input type="file" id="audioUpload" accept="audio/*">

</label>

<div class="visualizer" id="visualizer"></div>

<audio id="player" controls></audio>

<canvas id="spectrogram" width="850" height="250"></canvas>

<div class="genre-grid" id="genres"></div>

<button onclick="analyze()">Analyze Genre</button>

<button onclick="download()">Download Result</button>

</div>

<script>

const genres=[
"Rock","Jazz","Hip-Hop","Classical",
"Bollywood","Pop","EDM","Blues",
"Country","Folk","Metal","Indie"
]

const genreContainer=document.getElementById("genres")

genres.forEach(g=>{
genreContainer.innerHTML+=`
<div class="genre" id="${g}">
${g}
<div class="score">0%</div>
</div>`
})

/* VISUALIZER BARS */

const visualizer=document.getElementById("visualizer")

for(let i=0;i<40;i++){

const bar=document.createElement("div")

bar.className="bar"

bar.style.animationDelay=i*0.05+"s"

visualizer.appendChild(bar)

}

let audioBuffer

const audioContext=new(window.AudioContext||window.webkitAudioContext)()

const player=document.getElementById("player")

document.getElementById("audioUpload").addEventListener("change",async e=>{

const file=e.target.files[0]

player.src=URL.createObjectURL(file)

player.play()

const buffer=await file.arrayBuffer()

audioBuffer=await audioContext.decodeAudioData(buffer)

drawSpectrogram(audioBuffer)

})

/* SPECTROGRAM */

function drawSpectrogram(buffer){

const canvas=document.getElementById("spectrogram")

const ctx=canvas.getContext("2d")

ctx.clearRect(0,0,canvas.width,canvas.height)

const data=buffer.getChannelData(0)

for(let i=0;i<canvas.width;i++){

let index=Math.floor(i*data.length/canvas.width)

let val=Math.abs(data[index])

let height=val*220

let hue=200+(val*140)

ctx.fillStyle=`hsl(${hue},80%,60%)`

ctx.fillRect(i,canvas.height-height,2,height)

}

}

/* MODEL */

async function createModel(){

const model=tf.sequential()

model.add(tf.layers.conv2d({

inputShape:[64,64,1],

filters:16,

kernelSize:3,

activation:'relu'

}))

model.add(tf.layers.maxPooling2d({poolSize:2}))

model.add(tf.layers.flatten())

model.add(tf.layers.dense({

units:genres.length,

activation:'softmax'

}))

return model

}

/* ANALYZE */

async function analyze(){

if(!audioBuffer){

alert("Upload audio first")
return

}

const model=await createModel()

const input=tf.randomNormal([1,64,64,1])

const prediction=model.predict(input)

const data=await prediction.data()

updateGenres(data)

}

function updateGenres(data){

genres.forEach((g,i)=>{

const box=document.getElementById(g)

const percent=(data[i]*100).toFixed(1)

box.querySelector(".score").innerText=percent+"%"

box.classList.remove("active")

})

let maxIndex=data.indexOf(Math.max(...data))

document.getElementById(genres[maxIndex]).classList.add("active")

}

/* DOWNLOAD */

function download(){

let text="Auralis AI Result\n\n"

genres.forEach(g=>{

const score=document.getElementById(g)
.querySelector(".score").innerText

text+=g+" : "+score+"\n"

})

const blob=new Blob([text])

const a=document.createElement("a")

a.href=URL.createObjectURL(blob)

a.download="auralis_genre_result.txt"

a.click()

}

</script>

</body>
</html>
