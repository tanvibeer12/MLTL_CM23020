<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>Sentiment Classifier | Tanvi</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>

<style>

body{
font-family:Arial;
background:linear-gradient(135deg,#0f172a,#1e293b);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.container{
background:#111827;
padding:35px;
border-radius:15px;
width:520px;
text-align:center;
box-shadow:0 0 30px #38bdf8;
}

textarea{
width:90%;
height:100px;
padding:10px;
border-radius:8px;
border:none;
margin-top:10px;
font-size:15px;
}

button{
margin-top:15px;
padding:10px 22px;
border:none;
border-radius:6px;
background:#38bdf8;
font-size:16px;
cursor:pointer;
}

.result{
margin-top:20px;
font-size:20px;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h2>Sentiment Analyzer</h2>

<button onclick="trainModel()">Train Model</button>

<br>

<textarea id="inputText" placeholder="Enter your sentence"></textarea>

<br>

<button onclick="predict()">Analyze Sentiment</button>

<div class="result" id="result"></div>

</div>

<script>

let model;
let vocabulary={};
let dataset=[];

async function loadCSV(){

const response = await fetch("sentiment_data.csv");
const data = await response.text();

const rows=data.split("\n").slice(1);

rows.forEach(row=>{

let cols=row.split(",");

dataset.push({
text:cols[0],
label:Number(cols[1])
});

});

}

function tokenize(text){
return text.toLowerCase().split(" ");
}

function buildVocabulary(){

let index=1;

dataset.forEach(item=>{

let words=tokenize(item.text);

words.forEach(word=>{

if(!vocabulary[word]){
vocabulary[word]=index++;
}

});

});

}

function textToSequence(text){

let words=tokenize(text);
let seq=[];

words.forEach(word=>{
seq.push(vocabulary[word] || 0);
});

return seq;

}

async function trainModel(){

await loadCSV();

buildVocabulary();

let sequences=[];
let labels=[];

dataset.forEach(item=>{
sequences.push(textToSequence(item.text));
labels.push(item.label);
});

const maxLen=6;

let padded=sequences.map(seq=>{

while(seq.length<maxLen) seq.push(0);
return seq.slice(0,maxLen);

});

const xs=tf.tensor2d(padded);
const ys=tf.tensor2d(labels,[labels.length,1]);

model=tf.sequential();

model.add(tf.layers.embedding({
inputDim:1000,
outputDim:16,
inputLength:maxLen
}));

model.add(tf.layers.flatten());

model.add(tf.layers.dense({units:16,activation:"relu"}));

model.add(tf.layers.dense({units:1,activation:"sigmoid"}));

model.compile({
optimizer:"adam",
loss:"binaryCrossentropy",
metrics:["accuracy"]
});

document.getElementById("result").innerText="Training model...";

await model.fit(xs,ys,{epochs:20});

document.getElementById("result").innerText="Training Completed ✔";

}

async function predict(){

let text=document.getElementById("inputText").value;

let seq=textToSequence(text);

while(seq.length<6) seq.push(0);

let input=tf.tensor2d([seq]);

let prediction=model.predict(input);

let score=(await prediction.data())[0];

let sentiment = score>0.5 ? "Positive 😊" : "Negative 😞";

document.getElementById("result").innerHTML =
"Sentiment: "+sentiment+
"<br>Confidence Score: "+score.toFixed(2);

}

</script>

</body>
</html>
