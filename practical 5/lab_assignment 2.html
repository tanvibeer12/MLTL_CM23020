<!DOCTYPE html>
<html>
<head>
<title>Webcam Overlay Classification - Tanvi Beer</title>

<!-- TensorFlow.js -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<!-- MobileNet -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>

<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background: linear-gradient(120deg,#ff9a9e,#fad0c4);
font-family:'Poppins',sans-serif;
}

.container{
background:white;
padding:25px;
border-radius:25px;
box-shadow:0 15px 40px rgba(0,0,0,0.5);
text-align:center;
width:650px;
}

h1{
margin-bottom:15px;
color:#333;
}

#wrapper{
position:relative;
display:inline-block;
}

video{
width:550px;
height:400px;
border-radius:15px;
border:4px solid #333;
}

canvas{
position:absolute;
top:0;
left:0;
}

button{
margin-top:15px;
padding:12px 28px;
font-size:16px;
border:none;
background:#4CAF50;
color:white;
border-radius:8px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#45a049;
}
</style>
</head>

<body>

<div class="container">
<h1>Webcam Overlay Classification - Tanvi Beer</h1>

<div id="wrapper">
<video id="webcam" autoplay playsinline></video>
<canvas id="overlay"></canvas>
</div>

<br>
<button id="toggleBtn">Start Classification</button>
</div>

<script>
let model;
const video = document.getElementById("webcam");
const canvas = document.getElementById("overlay");
const ctx = canvas.getContext("2d");
const btn = document.getElementById("toggleBtn");

let classifying = false;
const colors = ["#ff0000","#00ff00","#0000ff"]; // unique color per prediction

// Setup webcam
async function setupWebcam(){
    const stream = await navigator.mediaDevices.getUserMedia({video:true});
    video.srcObject = stream;
    return new Promise(resolve=>{
        video.onloadedmetadata = ()=>{ resolve(); }
    })
}

// Start / Stop classification
btn.addEventListener("click", async ()=>{
    if(!classifying){
        btn.innerText = "Stop Classification";
        classifying = true;
        await setupWebcam();
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        model = await mobilenet.load();
        classifyFrame();
    } else {
        classifying = false;
        btn.innerText = "Start Classification";
        ctx.clearRect(0,0,canvas.width,canvas.height);
    }
});

// Classify and overlay top-3 labels
async function classifyFrame(){
    if(!classifying) return;

    const predictions = await model.classify(video);

    ctx.clearRect(0,0,canvas.width,canvas.height);

    // Draw top-3 predictions stacked in corner
    predictions.slice(0,3).forEach((p,i)=>{
        ctx.fillStyle = colors[i];
        ctx.font = "22px Poppins";
        ctx.strokeStyle = "#000";
        ctx.lineWidth = 2;
        const text = `${p.className} (${(p.probability*100).toFixed(1)}%)`;
        ctx.strokeText(text, 10, 30 + i*30);
        ctx.fillText(text, 10, 30 + i*30);
    });

    requestAnimationFrame(classifyFrame);
}
</script>

</body>
</html>
