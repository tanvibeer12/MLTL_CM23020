<!DOCTYPE html>
<html>
<head>
<title>Webcam Object Detection - Tanvi Beer</title>

<!-- TensorFlow.js -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<!-- Coco-SSD model -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background: linear-gradient(120deg,#1f4037,#99f2c8); /* Modern green-blue gradient */
font-family: 'Poppins', sans-serif;
}

.container{
background:#ffffffdd; /* Slightly transparent white */
padding:25px;
border-radius:25px;
box-shadow:0 15px 40px rgba(0,0,0,0.5);
text-align:center;
width:650px;
}

h1{
margin-bottom:15px;
color:#0d3b2e; /* Dark green */
font-size:30px;
}

#wrapper{
position:relative;
display:inline-block;
}

video{
width:550px;
height:400px;
border-radius:20px;
border:4px solid #0d3b2e; /* Dark green border */
}

canvas{
position:absolute;
top:0;
left:0;
}

button{
margin-top:15px;
padding:12px 28px;
font-size:16px;
border:none;
background:#ff5722; /* Orange button */
color:white;
border-radius:10px;
cursor:pointer;
transition: 0.3s;
}

button:hover{
background:#e64a19;
}

#status{
margin-top:12px;
font-weight:bold;
color:#0d3b2e;
}

#topPredictions{
margin-top:10px;
text-align:left;
font-size:16px;
color:#0d3b2e;
}
</style>
</head>

<body>

<div class="container">
<h1>Webcam Object Detection - Tanvi Beer</h1>

<div id="wrapper">
<video id="webcam" autoplay playsinline></video>
<canvas id="canvas"></canvas>
</div>

<br>
<button id="toggleBtn">Start Detection</button>
<div id="status">Status: Waiting</div>
<div id="topPredictions"></div>
</div>

<script>
let model;
const video = document.getElementById("webcam");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const status = document.getElementById("status");
const topPred = document.getElementById("topPredictions");
const btn = document.getElementById("toggleBtn");

let detecting = false;
let lastTime = performance.now();
let fps = 0;

// Setup webcam
async function setupWebcam(){
    const stream = await navigator.mediaDevices.getUserMedia({video:true});
    video.srcObject = stream;
    return new Promise(resolve=>{
        video.onloadedmetadata = ()=>{ resolve(); }
    })
}

// Start or stop detection
btn.addEventListener("click", async ()=>{
    if(!detecting){
        status.innerText = "Status: Loading Model...";
        model = await cocoSsd.load();
        status.innerText = "Status: Model Loaded.";
        await setupWebcam();
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        detecting = true;
        btn.innerText = "Stop Detection";
        detectFrame();
    } else {
        detecting = false;
        btn.innerText = "Start Detection";
        status.innerText = "Status: Detection Stopped";
        ctx.clearRect(0,0,canvas.width,canvas.height);
        topPred.innerHTML = "";
    }
});

// Detection loop
async function detectFrame(){
    if(!detecting) return;

    const predictions = await model.detect(video);

    // FPS calculation
    const now = performance.now();
    fps = Math.round(1000 / (now - lastTime));
    lastTime = now;

    status.innerText = `Status: Detecting - FPS: ${fps}`;

    // Clear canvas
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // Draw predictions with custom color
    let top3 = predictions.slice(0,3); // top 3 objects
    topPred.innerHTML = "<b>Top Predictions:</b><br>" + top3.map(p=>`${p.class} (${(p.score*100).toFixed(1)}%)`).join("<br>");

    predictions.forEach(pred=>{
        ctx.strokeStyle = "#ff9800"; // bright orange bounding box
        ctx.lineWidth = 4;
        ctx.strokeRect(pred.bbox[0], pred.bbox[1], pred.bbox[2], pred.bbox[3]);

        ctx.fillStyle = "#ff9800";
        ctx.font = "18px Poppins";
        ctx.fillText(pred.class + " (" + (pred.score*100).toFixed(1) + "%)", pred.bbox[0], pred.bbox[1]>20 ? pred.bbox[1]-5 : 10);
    });

    requestAnimationFrame(detectFrame);
}
</script>

</body>
</html>
